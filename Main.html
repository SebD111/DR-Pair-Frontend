<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DR Musikplader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">
    <div id="app" class="container py-5">
        <h1 class="mb-4">DR Musikplader</h1>

        <form @submit.prevent="fetchRecords" class="row g-3 mb-4">
            <div class="col-md-5">
                <label for="titleFilter" class="form-label">Titel</label>
                <input id="titleFilter" v-model="titleFilter" type="text" class="form-control">
            </div>
            <div class="col-md-5">
                <label for="artistFilter" class="form-label">Kunstner</label>
                <input id="artistFilter" v-model="artistFilter" type="text" class="form-control">
            </div>
            <div class="col-md-2 d-flex align-items-end gap-2">
                <button id="searchButton" type="submit" class="btn btn-primary" :disabled="isLoading">Søg</button>
                <button id="resetButton" type="button" class="btn btn-secondary" :disabled="isLoading" @click="resetFilters">Nulstil</button>
            </div>
        </form>

        <div v-if="errorMessage" class="alert alert-danger" role="alert">
            {{ errorMessage }}
        </div>

        <div v-if="isLoading" class="text-muted" role="status">
            Indlæser musikplader...
        </div>

        <div v-if="records.length > 0" class="table-responsive">
            <table id="recordsTable" class="table table-striped table-hover table-bordered bg-white shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>Titel</th>
                        <th>Kunstner</th>
                        <th>Varighed i sekunder</th>
                        <th>Udgivelsesår</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="record in records" :key="record.id">
                        <td>{{ record.title }}</td>
                        <td>{{ record.artist }}</td>
                        <td>{{ record.duration }}</td>
                        <td>{{ record.publicationYear }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div v-else-if="!isLoading && !errorMessage" id="noResults" class="text-muted" role="status">
            Ingen musikplader fundet
        </div>
    </div>

    <!-- Placeret i bunden så #app er indlæst i DOM'en først -->
    <script src="Main.js"></script>
</body>
</html>
