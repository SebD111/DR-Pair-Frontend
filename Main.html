<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DR Musikplader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">
    <div id="app" class="container py-5">
        <h1 class="mb-4">DR Musikplader</h1>

        <div v-if="errorMessage" class="alert alert-danger" role="alert">
            {{ errorMessage }}
        </div>

        <div v-if="records.length > 0" class="table-responsive">
            <table class="table table-striped table-hover table-bordered bg-white shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>Titel</th>
                        <th>Kunstner</th>
                        <th>Varighed i sekunder</th>
                        <th>Udgivelsesår</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="record in records" :key="record.id">
                        <td>{{ record.title }}</td>
                        <td>{{ record.artist }}</td>
                        <td>{{ record.durationInSeconds ?? record.duration }}</td>
                        <td>{{ record.publicationYear ?? record.yearOfPublication ?? record.year }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div v-else-if="!errorMessage" class="text-muted">
            Indlæser musikplader...
        </div>
    </div>

    <!-- Placeret i bunden så #app er indlæst i DOM'en først -->
    <script src="main.js"></script>
</body>
</html>
